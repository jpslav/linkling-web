name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job runs on ubuntu-24.04, not on the `ubuntu-latest` alias, which starts moving to Ubuntu
# 26.04 on 2026-10-19, in a rollout over several weeks that is to be complete by 2026-11-19
# (actions/runner-images#14748). The two Docker jobs (image-privacy and no-third-party-site) run on
# whatever Docker and kernel the image ships, so the move should reach them when someone changes the
# label and watches them go green, not on dates GitHub chose. `ubuntu-latest` was `ubuntu-24.04` when
# this was pinned (a run on `main` from 2026-09-23, before the pin, printed `Image: ubuntu-24.04`),
# so the pin changes nothing today. This repository has no .github/dependabot.yml, so only a person
# moves the label, and tests/test_ll035_site_check_in_ci.py fails unless every job names a versioned
# Ubuntu image (`ubuntu-NN.NN`), so an alias or an expression in its place is red.

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q

  image-privacy:
    name: image-privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/image-privacy-smoke.sh

  # LL-035: the no-third-party check, run on the site as it is proposed here, so what the built image
  # serves and sends is judged in the pull request that changes it, and not only on the next
  # linkling-api build (whose own job of this name checks this repository's `main`, LL-034).
  # tests/test_no_third_party.py is the other half: it reads site/ for literal remote references,
  # and this job judges what is served.
  # The check is linkling-api's, not a copy: scripts/no-third-party-check.sh (ADR-0009 there) builds
  # this repository's Dockerfile into linkling-api's compose stack, captures every packet the site
  # container sends while its pages and stylesheets are fetched, and reads what it serves. A packet
  # that is not a reply to the check's own requests fails it, and so does any DNS lookup, and so does
  # an absolute URL, a <script> or an inline event handler in what the site serves. So the job checks
  # out both repositories, each into its own directory (a checkout refuses a path outside the
  # workspace: actions/checkout src/input-helper.ts:39-51 at the pinned SHA; and the site's Docker
  # build context is linkling-web/, which then holds neither linkling-api nor the check's scratch
  # data): this repository, and linkling-api at its trunk, `main`. Both are
  # public, so that takes no deploy key and no secret of ours: the action passes the workflow's own
  # token, and `persist-credentials: false` leaves none of it behind in either checkout.
  # Because the check is linkling-api's `main`, a change there to the script or to what it builds
  # (compose.yaml, its Dockerfile, deploy/nginx-privacy.conf) reaches this job as soon as it merges
  # there, with no change here.
  # A missing checkout is red, never green. With no site directory the script ends `blind: no
  # linkling-web checkout at <dir>` (exit 2); with no script the shell ends `No such file or
  # directory` (exit 127). The job's keys, its three steps and each step's keys are pinned exactly in
  # tests/test_ll035_site_check_in_ci.py, so an `if:`, `shell:`, `env:` or `continue-on-error:`, which
  # could turn the step into a green no-op, and a fourth step, have to be argued for there.
  no-third-party-site:
    name: no-third-party-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: linkling-web
          persist-credentials: false
      - name: check out the check and the stack it builds, from linkling-api's trunk, which is public
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jpslav/linkling-api
          ref: main
          path: linkling-api
          persist-credentials: false
      - name: the whole check passes against this checkout
        run: LINKLING_WEB_DIR="$GITHUB_WORKSPACE/linkling-web" linkling-api/scripts/no-third-party-check.sh

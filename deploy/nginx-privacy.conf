# Baked into this image by the Dockerfile (see docs/adr/0003-bake-privacy-directives-into-image.md),
# so the site container is private on its own -- no compose file or external mount required.
# Stock nginx writes every visitor's address to its access log, and its error log adds
# "client: <address>" to every request-level error: a missing file (404), an oversized body
# (413), a directory with no index (403), and more. Any of those breaks ADR-0004's promise
# (linkling-api) that Linkling keeps no IP addresses.
#
# Carried over from linkling-api's deploy/nginx-privacy.conf (api #8), which mounts an
# identical file into this same container at the same path; that mount now overlays a file
# already present and changes nothing (see the ADR above).
access_log off;
log_not_found off;
# The error log is off for request handling altogether, not just quieter: nginx attaches
# the client's address to a request-level error at any level, including `crit` (measured in
# linkling-api's w-LL-005: a docroot entry that is not a regular file). Startup and
# configuration errors still reach `docker logs`, from the main context's own error log.
error_log /dev/null;
